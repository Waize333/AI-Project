services:
  - type: web
    name: sfy-ai-travel-planner-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://sfy-ai-travel-planner.vercel.app
